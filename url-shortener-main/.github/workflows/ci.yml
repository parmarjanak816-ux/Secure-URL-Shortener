name: CI

# Run on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Job 1: backend — typecheck + run the Vitest suite ──
  backend:
    name: Backend (API)
    runs-on: ubuntu-latest          # GitHub gives us a fresh Linux VM
    defaults:
      run:
        working-directory: UrlShortener.API   # all commands run in here
    env:
      # Prisma needs these to exist; tests are mocked so values are dummies.
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4              # clone the repo
      - uses: actions/setup-node@v4            # install Node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UrlShortener.API/package-lock.json
      - run: npm ci                            # clean install from lockfile
      - run: npx prisma generate               # generate the Prisma client
      - run: npx tsc --noEmit                  # typecheck (no output files)
      - run: npm test                          # run Vitest once

  # ── Job 2: frontend — typecheck + production build ──
  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UrlShortener.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UrlShortener.Web/package-lock.json
      - run: npm ci
      - run: npm run build      # "tsc -b && vite build" — typechecks AND builds
